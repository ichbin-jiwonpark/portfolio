<text x="805.0" y="145.0" text-anchor="middle" font-family="Helvetica Neue, Arial, sans-serif" font-size="13" font-weight="600" fill="#17201e">Statement-name reference</text>
<text x="805.0" y="163.0" text-anchor="middle" font-family="Helvetica Neue, Arial, sans-serif" font-size="12" font-weight="400" fill="#586561">tested with every card company</text>
