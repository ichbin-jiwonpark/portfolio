<text x="305.0" y="349.0" text-anchor="middle" font-family="Helvetica Neue, Arial, sans-serif" font-size="13" font-weight="600" fill="#17201e">Approval &amp; cancellation tests</text>
<text x="305.0" y="367.0" text-anchor="middle" font-family="Helvetica Neue, Arial, sans-serif" font-size="12" font-weight="400" fill="#586561">settlement not testable yet</text>
