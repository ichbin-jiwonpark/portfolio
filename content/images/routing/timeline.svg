<text x="805.0" y="213.0" text-anchor="middle" font-family="Helvetica Neue, Arial, sans-serif" font-size="13" font-weight="600" fill="#17201e">Card-issuer benefits</text>
<text x="805.0" y="231.0" text-anchor="middle" font-family="Helvetica Neue, Arial, sans-serif" font-size="12" font-weight="400" fill="#586561">traced case by case</text>
<rect x="680" y="256" width="250" height="40" rx="8" fill="#ffffff" stroke="#c9d0c9" stroke-width="1.5"/>
<text x="805.0" y="281.0" text-anchor="middle" font-family="Helvetica Neue, Arial, sans-serif" font-size="13" font-weight="600" fill="#17201e">Normal operations</text>
