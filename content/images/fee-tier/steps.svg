<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 430" width="960" height="430" role="img" aria-label="Four steps from the association file to the right fee and processing route">
<rect width="960" height="430" rx="12" fill="#f3f5f2"/>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#586561"/></marker><marker id="b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#24557f"/></marker></defs>
<text x="24" y="38" text-anchor="start" font-family="Helvetica Neue, Arial, sans-serif" font-size="15" font-weight="600" fill="#17201e">From the association file to the right fee, in four steps</text>
<rect x="24" y="62" width="300" height="50" rx="8" fill="#ffffff" stroke="#c9d0c9" stroke-width="1.5"/>
<text x="174.0" y="83.0" text-anchor="middle" font-family="Helvetica Neue, Arial, sans-serif" font-size="13" font-weight="600" fill="#17201e">Association tier lists</text>
<text x="174.0" y="101.0" text-anchor="middle" font-family="Helvetica Neue, Arial, sans-serif" font-size="12" font-weight="400" fill="#586561">every half-year, per tier</text>
<path d="M174 116L174 150" stroke="#586561" stroke-width="1.5" fill="none" marker-end="url(#a)"/>
<rect x="24" y="156" width="210" height="128" rx="8" fill="#e3ecf4" stroke="#24557f" stroke-width="1.5"/>
<text x="129.0" y="198.0" text-anchor="middle" font-family="Helvetica Neue, Arial, sans-serif" font-size="13" font-weight="600" fill="#17201e">1. Source data in</text>
<text x="129.0" y="216.0" text-anchor="middle" font-family="Helvetica Neue, Arial, sans-serif" font-size="12" font-weight="400" fill="#586561">the original file uploaded,</text>
<text x="129.0" y="234.0" text-anchor="middle" font-family="Helvetica Neue, Arial, sans-serif" font-size="12" font-weight="400" fill="#586561">checked against the last</text>
<text x="129.0" y="252.0" text-anchor="middle" font-family="Helvetica Neue, Arial, sans-serif" font-size="12" font-weight="400" fill="#586561">period, exceptions flagged</text>
<path d="M238 220.0L252 220.0" stroke="#586561" stroke-width="1.5" fill="none" marker-end="url(#a)"/>
<rect x="258" y="156" width="210" height="128" rx="8" fill="#ffffff" stroke="#c9d0c9" stroke-width="1.5"/>
<text x="363.0" y="198.0" text-anchor="middle" font-family="Helvetica Neue, Arial, sans-serif" font-size="13" font-weight="600" fill="#17201e">2. Fees for every tier</text>
<text x="363.0" y="216.0" text-anchor="middle" font-family="Helvetica Neue, Arial, sans-serif" font-size="12" font-weight="400" fill="#586561">registered up front,</text>
<text x="363.0" y="234.0" text-anchor="middle" font-family="Helvetica Neue, Arial, sans-serif" font-size="12" font-weight="400" fill="#586561">switch automatically</text>
<text x="363.0" y="252.0" text-anchor="middle" font-family="Helvetica Neue, Arial, sans-serif" font-size="12" font-weight="400" fill="#586561">when the tier changes</text>
<path d="M472 220.0L486 220.0" stroke="#586561" stroke-width="1.5" fill="none" marker-end="url(#a)"/>
<rect x="492" y="156" width="210" height="128" rx="8" fill="#ffffff" stroke="#c9d0c9" stroke-width="1.5"/>
<text x="597.0" y="207.0" text-anchor="middle" font-family="Helvetica Neue, Arial, sans-serif" font-size="13" font-weight="600" fill="#17201e">3. Card-company data</text>
<text x="597.0" y="225.0" text-anchor="middle" font-family="Helvetica Neue, Arial, sans-serif" font-size="12" font-weight="400" fill="#586561">from 4–5 separate</text>
<text x="597.0" y="243.0" text-anchor="middle" font-family="Helvetica Neue, Arial, sans-serif" font-size="12" font-weight="400" fill="#586561">screens into one</text>
<path d="M706 220.0L720 220.0" stroke="#586561" stroke-width="1.5" fill="none" marker-end="url(#a)"/>
<rect x="726" y="156" width="210" height="128" rx="8" fill="#ffffff" stroke="#c9d0c9" stroke-width="1.5"/>
<text x="831.0" y="198.0" text-anchor="middle" font-family="Helvetica Neue, Arial, sans-serif" font-size="13" font-weight="600" fill="#17201e">4. Processing groups</text>
<text x="831.0" y="216.0" text-anchor="middle" font-family="Helvetica Neue, Arial, sans-serif" font-size="12" font-weight="400" fill="#586561">updated in bulk, not</text>
<text x="831.0" y="234.0" text-anchor="middle" font-family="Helvetica Neue, Arial, sans-serif" font-size="12" font-weight="400" fill="#586561">one merchant ID</text>
<text x="831.0" y="252.0" text-anchor="middle" font-family="Helvetica Neue, Arial, sans-serif" font-size="12" font-weight="400" fill="#586561">at a time</text>
<path d="M831.0 288L831.0 324" stroke="#24557f" stroke-width="1.5" fill="none" marker-end="url(#b)"/>
<rect x="636" y="330" width="300" height="56" rx="8" fill="#e3ecf4" stroke="#24557f" stroke-width="1.5"/>
<text x="786.0" y="354.0" text-anchor="middle" font-family="Helvetica Neue, Arial, sans-serif" font-size="13" font-weight="600" fill="#17201e">Right fee, right route</text>
<text x="786.0" y="372.0" text-anchor="middle" font-family="Helvetica Neue, Arial, sans-serif" font-size="12" font-weight="400" fill="#586561">for each merchant</text>
<text x="24" y="322" text-anchor="start" font-family="Helvetica Neue, Arial, sans-serif" font-size="12" font-weight="400" fill="#586561">Step 1 tackles the root cause: the source data, visible and checkable in the system.</text>
</svg>